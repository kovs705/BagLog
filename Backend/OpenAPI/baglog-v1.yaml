openapi: 3.1.0
info:
  title: BagLog API
  version: 0.4.0
  description: |
    Implemented BagLog account, profile, private loadout synchronization, and
    health API. Routes absent from this document are not part of the supported
    API contract.
servers:
  - url: https://api.baglog.app
    description: Production
tags:
  - name: health
    description: Process and dependency health.
  - name: authentication
    description: Federated sign-in and BagLog session transitions.
  - name: profile
    description: The authenticated account's profile.
  - name: account
    description: Account lifecycle operations.
  - name: loadout
    description: The authenticated account's private loadout aggregates.
  - name: sync
    description: Durable bootstrap and incremental private loadout synchronization.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      tags: [health]
      security: []
      responses:
        "204":
          description: The process can serve HTTP.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
  /health/ready:
    get:
      operationId: getReadiness
      summary: Dependency-aware readiness
      tags: [health]
      security: []
      responses:
        "204":
          description: PostgreSQL is reachable.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /v1/auth/apple/nonce:
    post:
      operationId: createAppleNonce
      summary: Create a single-use Sign in with Apple nonce
      description: |
        Send the SHA-256 hex digest of the returned nonce to Apple, then send
        the raw nonce back to the Apple sign-in operation.
      tags: [authentication]
      security: []
      responses:
        "201":
          description: Nonce created. Send its SHA-256 hex digest to Apple.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [nonce, expires_at]
                properties:
                  nonce:
                    type: string
                    minLength: 43
                    maxLength: 43
                    pattern: "^[A-Za-z0-9_-]{43}$"
                  expires_at: {type: string, format: date-time}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/auth/apple/sign-in:
    post:
      operationId: signInWithApple
      summary: Verify Apple credentials and create a BagLog session
      tags: [authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identity_token, authorization_code, nonce]
              properties:
                identity_token: {type: string, minLength: 1, maxLength: 20480}
                authorization_code: {type: string, minLength: 1, maxLength: 4096}
                nonce:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: "^[A-Za-z0-9_-]{43}$"
      responses:
        "200":
          description: Authenticated session.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/auth/google/sign-in:
    post:
      operationId: signInWithGoogle
      summary: Verify a Google ID token and create a BagLog session
      tags: [authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identity_token]
              properties:
                identity_token: {type: string, minLength: 1, maxLength: 20480}
      responses:
        "200":
          description: Authenticated session.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate an opaque refresh token
      tags: [authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: "^[A-Za-z0-9_-]{43}$"
      responses:
        "200":
          description: Rotated session tokens.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the authenticated token family
      tags: [authentication]
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Session family revoked.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/auth/apple/events:
    post:
      operationId: receiveAppleAccountEvent
      summary: Receive an Apple-signed account notification
      description: |
        This operation does not use a BagLog bearer token. The signed JWS in
        `payload` is the credential and is verified before the event is used.
      tags: [authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload: {type: string, minLength: 1, maxLength: 20480}
      responses:
        "204":
          description: Signed event accepted or already processed.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/profile:
    get:
      operationId: getOwnProfile
      summary: Read the authenticated account's profile
      tags: [profile]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Profile. The strong ETag is its current revision.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}
    post:
      operationId: createOwnProfile
      summary: Create the authenticated account's profile
      tags: [profile]
      security: [{bearerAuth: []}]
      requestBody:
        $ref: "#/components/requestBodies/ProfileWrite"
      responses:
        "201":
          description: Profile created.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalServerError"}
    put:
      operationId: updateOwnProfile
      summary: Replace profile fields at an expected revision
      tags: [profile]
      security: [{bearerAuth: []}]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the latest profile read or write.
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
      requestBody:
        $ref: "#/components/requestBodies/ProfileWrite"
      responses:
        "200":
          description: Profile updated.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/loadouts:
    post:
      operationId: createPrivateLoadout
      summary: Create a private loadout aggregate
      description: |
        The client owns every loadout, item, and link UUID. Repeating the same
        canonical mutation with the same Idempotency-Key returns the stored
        response without applying another change.
      tags: [loadout]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        $ref: "#/components/requestBodies/LoadoutWrite"
      responses:
        "201":
          description: Private loadout created.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loadout"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/loadouts/{loadout_id}:
    parameters:
      - {$ref: "#/components/parameters/LoadoutID"}
    get:
      operationId: getPrivateLoadout
      summary: Read an owned private loadout aggregate
      tags: [loadout]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Current private loadout aggregate.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loadout"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}
    put:
      operationId: replacePrivateLoadout
      summary: Replace an owned private loadout aggregate at an expected revision
      description: |
        The body UUID must equal the path UUID. The complete item, link, and tag
        graph is replaced in one transaction.
      tags: [loadout]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        $ref: "#/components/requestBodies/LoadoutWrite"
      responses:
        "200":
          description: Updated private loadout aggregate.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loadout"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
        "500": {$ref: "#/components/responses/InternalServerError"}
    delete:
      operationId: deletePrivateLoadout
      summary: Delete an owned private loadout at an expected revision
      description: |
        The request body must be empty. Deletion preserves a durable sync
        tombstone through the documented offline retention window.
      tags: [loadout]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/IfMatch"}
      responses:
        "200":
          description: Loadout deleted and tombstone recorded.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoadoutTombstone"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "412": {$ref: "#/components/responses/PreconditionFailed"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/sync/bootstrap:
    get:
      operationId: bootstrapPrivateLoadouts
      summary: Page through the current private loadout state
      description: |
        Omit cursor and after on the first request. Keep the returned cursor
        fixed while following next_after, then request incremental changes from
        that cursor. Restart bootstrap if the cursor expires.
      tags: [sync]
      security: [{bearerAuth: []}]
      parameters:
        - name: cursor
          in: query
          description: Fixed bootstrap watermark returned by the first page.
          schema: {$ref: "#/components/schemas/SyncCursor"}
        - name: after
          in: query
          description: Exclusive loadout UUID returned as next_after.
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/SyncLimit"}
      responses:
        "200":
          description: A bootstrap page and its fixed change watermark.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoadoutBootstrapPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "410": {$ref: "#/components/responses/Gone"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/sync/changes:
    get:
      operationId: getPrivateLoadoutChanges
      summary: Read durable private loadout changes after a cursor
      description: |
        Upserts contain the aggregate snapshot committed with the mutation.
        Deletes contain a revisioned tombstone and a null loadout.
      tags: [sync]
      security: [{bearerAuth: []}]
      parameters:
        - name: cursor
          in: query
          required: true
          description: Exclusive cursor from bootstrap or a previous change page.
          schema: {$ref: "#/components/schemas/SyncCursor"}
        - {$ref: "#/components/parameters/SyncLimit"}
      responses:
        "200":
          description: Ordered durable changes after the supplied cursor.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoadoutChangePage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "410": {$ref: "#/components/responses/Gone"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /v1/account:
    delete:
      operationId: deleteOwnAccount
      summary: Revoke sessions and durably request complete account deletion
      description: The request body must be empty.
      tags: [account]
      security: [{bearerAuth: []}]
      responses:
        "202":
          description: Deletion accepted; access is revoked immediately.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestID"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalServerError"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: BagLog access token issued by a sign-in or refresh operation.
  headers:
    RequestID:
      description: Identifier repeated in an error response's `trace_id`.
      schema:
        type: string
        pattern: "^(?:[a-f0-9]{32}|request-id-unavailable)$"
    RevisionETag:
      description: Strong quoted integer aggregate revision.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IdempotencyReplayed:
      description: Present and true only when the stored mutation response was replayed.
      schema: {type: string, const: "true"}
  parameters:
    LoadoutID:
      name: loadout_id
      in: path
      required: true
      description: Application-owned stable loadout UUID.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID scoped to the authenticated account and bound to the canonical
        method, resource, expected revision, and aggregate body.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong revision ETag returned by the latest successful read or write.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    SyncLimit:
      name: limit
      in: query
      description: Maximum entries in this page.
      schema: {type: integer, minimum: 1, maximum: 20, default: 20}
  requestBodies:
    ProfileWrite:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProfileWrite"}
    LoadoutWrite:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoadoutWrite"}
  responses:
    BadRequest:
      description: Invalid request.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing, invalid, expired, or replayed credential.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
        WWW-Authenticate:
          description: Bearer challenge on protected operations.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: The authenticated account is unavailable for this transition.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Resource, identifier, or idempotency conflict.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
        Retry-After:
          description: Suggested retry delay when the same mutation is still processing.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PreconditionFailed:
      description: The supplied revision is stale.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PreconditionRequired:
      description: A strong If-Match revision is required.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Gone:
      description: The durable sync cursor has expired and bootstrap is required.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Authentication transition rate limit exceeded.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ServiceUnavailable:
      description: A required dependency or configured identity provider is unavailable.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
        Retry-After:
          description: Suggested delay in seconds when an identity provider is unavailable.
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalServerError:
      description: An unexpected internal failure occurred.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, token_type]
      properties:
        access_token: {type: string, minLength: 1, maxLength: 4096}
        access_expires_at: {type: string, format: date-time}
        refresh_token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        refresh_expires_at: {type: string, format: date-time}
        token_type: {type: string, const: Bearer}
    ProfileWrite:
      type: object
      additionalProperties: false
      required: [handle, display_name]
      properties:
        handle: {type: string, pattern: '^[A-Za-z0-9_]{3,30}$'}
        display_name: {type: string, minLength: 1, maxLength: 80}
        bio: {type: [string, "null"], maxLength: 500}
    Profile:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/ProfileWrite"}
        - type: object
          required: [id, revision, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    LoadoutLink:
      type: object
      additionalProperties: false
      required: [id, url]
      properties:
        id: {type: string, format: uuid}
        url:
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 2048
        label: {type: [string, "null"], minLength: 1, maxLength: 160}
    LoadoutItem:
      type: object
      additionalProperties: false
      required: [id, title, quantity, is_essential, links]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 240}
        category: {type: [string, "null"], minLength: 1, maxLength: 120}
        brand: {type: [string, "null"], minLength: 1, maxLength: 160}
        model: {type: [string, "null"], minLength: 1, maxLength: 160}
        notes: {type: [string, "null"], minLength: 1, maxLength: 4000}
        quantity: {type: integer, minimum: 1, maximum: 10000}
        is_essential: {type: boolean}
        links:
          type: array
          maxItems: 10
          items: {$ref: "#/components/schemas/LoadoutLink"}
    LoadoutWrite:
      type: object
      additionalProperties: false
      required: [id, title, summary, category, items, tags]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        summary: {type: string, maxLength: 4000}
        category: {type: string, minLength: 1, maxLength: 80}
        items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/LoadoutItem"}
        tags:
          type: array
          maxItems: 30
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 80}
    Loadout:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/LoadoutWrite"}
        - type: object
          required: [revision, created_at, updated_at]
          properties:
            revision: {type: integer, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    LoadoutTombstone:
      type: object
      additionalProperties: false
      required: [id, revision, deleted_at]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        deleted_at: {type: string, format: date-time}
    SyncCursor:
      type: integer
      format: int64
      minimum: 0
    LoadoutBootstrapPage:
      type: object
      additionalProperties: false
      required: [loadouts, cursor, next_after, has_more]
      properties:
        loadouts:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/Loadout"}
        cursor: {$ref: "#/components/schemas/SyncCursor"}
        next_after: {type: [string, "null"], format: uuid}
        has_more: {type: boolean}
    LoadoutChange:
      type: object
      additionalProperties: false
      required: [cursor, resource_id, operation, revision, changed_at, loadout]
      properties:
        cursor: {$ref: "#/components/schemas/SyncCursor"}
        resource_id: {type: string, format: uuid}
        operation: {type: string, enum: [upsert, delete]}
        revision: {type: integer, minimum: 1}
        changed_at: {type: string, format: date-time}
        loadout:
          oneOf:
            - {$ref: "#/components/schemas/Loadout"}
            - {type: "null"}
    LoadoutChangePage:
      type: object
      additionalProperties: false
      required: [changes, next_cursor, has_more]
      properties:
        changes:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/LoadoutChange"}
        next_cursor: {$ref: "#/components/schemas/SyncCursor"}
        has_more: {type: boolean}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, trace_id]
      properties:
        code: {type: string, pattern: "^[a-z0-9_]+$"}
        message: {type: string}
        trace_id:
          type: string
          pattern: "^(?:[a-f0-9]{32}|request-id-unavailable)$"
